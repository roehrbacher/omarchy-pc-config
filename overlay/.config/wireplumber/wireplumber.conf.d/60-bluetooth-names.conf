## The Bose headphones' Bluetooth name starts with an emoji ("🕺🏽Bose").
## pactl's JSON output cannot print it, so Ctrl+^ (omarchy-audio-output-switch)
## and the audio panel showed the output as "(null)". Give it a plain name.

monitor.bluez.rules = [
  {
    matches = [
      # Match by Bluetooth name, not address: description is the device's
      # Bluetooth name ("🕺🏽Bose"); ~ makes it a regex.
      { node.name = "~bluez_output.*", node.description = "~.*Bose.*" }
      { node.name = "~bluez_input.*", node.description = "~.*Bose.*" }
    ]
    actions = {
      update-props = {
        node.description = "Bose"
        node.nick = "Bose"
      }
    }
  }
]
