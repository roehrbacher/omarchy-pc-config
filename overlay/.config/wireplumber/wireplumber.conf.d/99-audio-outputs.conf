## Keep only Speakers (USB Audio), Headphones (USB-C 3.5mm jack), and
## the Razer Seiren Mini mic. Hide GPU HDMI/DP audio, motherboard HDMI,
## USB S/PDIF, unused front-headphone jack, and the unused ASUS USB Audio
## line-in / onboard mic. Rename the two remaining sinks for the Omarchy
## audio popup and Ctrl+^ output switcher.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_03_00.1" }
      { device.name = "alsa_card.pci-0000_0d_00.1" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.usb-Generic_USB_Audio-00.HiFi__SPDIF__sink" }
      { node.name = "alsa_output.usb-Generic_USB_Audio-00.HiFi__Headphones__sink" }
      { node.name = "alsa_input.usb-Generic_USB_Audio-00.HiFi__Line__source" }
      { node.name = "alsa_input.usb-Generic_USB_Audio-00.HiFi__Mic__source" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.usb-Generic_USB_Audio-00.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        node.nick = "Speakers"
        node.description = "Speakers"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Apple__Inc._USB-C_to_3.5mm_Headphone_Jack_Adapter_.*analog-stereo" }
    ]
    actions = {
      update-props = {
        node.nick = "Headphones"
        node.description = "Headphones"
      }
    }
  }
]
