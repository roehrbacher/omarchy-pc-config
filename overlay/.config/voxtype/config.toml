# @HOME@ is replaced with your home folder by install.sh.
# Voxtype Configuration
#
# Location: ~/.config/voxtype/config.toml
# All settings can be overridden via CLI flags
#
# State file for external integrations (Waybar, polybar, Omarchy bar).
# Required for `voxtype record toggle` and `voxtype status` commands.
state_file = "auto"

[hotkey]
# Hyprland owns the hotkey (Context Menu hold). Keep the evdev listener off so
# the two paths cannot double-fire after joining the `input` group.
enabled = false
key = "MENU"
mode = "push_to_talk"
cancel_key = "ESC"

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 120
# Gaming: lower other streams instead of pausing MPRIS players.
pause_media = false
duck_media = true
duck_media_volume_percent = 34
duck_media_fade_ms = 150

[audio.feedback]
enabled = true
theme = "subtle"
volume = 0.5

[whisper]
# RX 9060 XT + Vulkan. Quantized large-v3-turbo (q5_0) is the quality/speed
# sweet spot: ~550MB, near-full turbo accuracy, light on VRAM while gaming.
model = "@HOME@/.local/share/voxtype/models/ggml-large-v3-turbo-q5_0.bin"
# Auto-detect, constrained to English and German (faster and more accurate
# than unrestricted auto).
language = "en,de"
translate = false
# Vocabulary hint: Whisper leans toward these spellings. Keep it short,
# a long prompt can leak into very short recordings.
initial_prompt = "Omarchy, OmaCalc, Hyprland, Grok, Grok Bot, Grok Build, Voxtype, Timon Röhrbacher, Wardogs, Proton, Obsidian, Tailscale, Sunshine, Moonlight, GitHub."

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 1
wait_for_modifier_release = true
modifier_release_timeout_ms = 750

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false

[text]
spoken_punctuation = true
filter_filler_words = true

# Fixes for words dictation keeps getting wrong (found in past transcripts).
# Whole-word, case-insensitive. Keep keys from overlapping each other: the
# order they are applied in is not fixed.
[text.replacements]
"omarchi" = "Omarchy"
"omarchie" = "Omarchy"
"omarchey" = "Omarchy"
"omarci" = "Omarchy"
"omarji" = "Omarchy"
"omargie" = "Omarchy"
"amarji" = "Omarchy"
"amarchi" = "Omarchy"
"marchi" = "Omarchy"
"marchie" = "Omarchy"
"oh marchy" = "Omarchy"
"o'marchy" = "Omarchy"
"omachi" = "Omarchy"
"ohmachi" = "Omarchy"
"omaki" = "Omarchy"
"oma key" = "Omarchy"
# Cleanup when "marchi"/"marchie" fired inside "oh marchie" / "a marchi"
# (replacements run twice, so these catch the leftovers).
"oh omarchy" = "Omarchy"
"a omarchy" = "Omarchy"
"omer calc" = "OmaCalc"
"oma calc" = "OmaCalc"
"grogbot" = "Grok Bot"
"grog bot" = "Grok Bot"
"vox type" = "Voxtype"
"voxtape" = "Voxtype"
"vox tape" = "Voxtype"
"tmon" = "Timon"
"war dogs" = "Wardogs"
"ibecoded" = "vibe coded"
"grock" = "Grok"
"grog build" = "Grok Build"
"hyperland" = "Hyprland"
"hyper land" = "Hyprland"

[vad]
enabled = true
backend = "whisper"
threshold = 0.5

[osd]
# Disabled 2026-09-13: voxtype-osd-gtk4 oopsed in amdgpu/ttm
# (ttm_lru_bulk_move_tail NULL deref) and wedged the whole machine.
# Dictation still works; audio.feedback is the recording cue.
enabled = false
