# Clean Mic: Razer Seiren V3 Mini -> DeepFilterNet (removes keyboard/mouse clicks).
# Runs as its own PipeWire client process (clean-mic.service), so a crash here can't take down system audio.
context.properties = { log.level = 0 }
context.spa-libs = {
  audio.convert.* = audioconvert/libspa-audioconvert
  support.*       = support/libspa-support
}
context.modules = [
  { name = libpipewire-module-rt args = { rtportal.enabled = false } flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Clean Mic"
      media.name       = "Clean Mic"
      filter.graph = {
        nodes = [
          { type = ladspa name = dfn plugin = libdeep_filter_ladspa label = deep_filter_mono
            control = { "Attenuation Limit (dB)" = 100 } }
        ]
        # No extra noise gate: PipeWire 1.6.9's builtin noisegate outputs pure silence here
        # (tested, even with default settings). DeepFilterNet already mutes clicks between words.
      }
      audio.rate = 48000
      audio.channels = 1
      audio.position = [ MONO ]
      capture.props = {
        node.name      = "capture.clean_mic"
        node.passive   = true
        target.object  = "alsa_input.usb-Razer_Inc._Razer_Seiren_V3_Mini-00.mono-fallback"
      }
      playback.props = {
        node.name   = "clean_mic"
        media.class = Audio/Source
      }
    }
  }
]
