# @HOME@ is replaced with your home folder by install.sh (Brave flags do not expand ~ or $HOME).
--ozone-platform=wayland
--ozone-platform-hint=wayland
--password-store=gnome-libsecret
--enable-features=TouchpadOverscrollHistoryNavigation
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim,@HOME@/Work/lumo-summarize-extension,@HOME@/Work/grok-summarize-extension
--force-device-scale-factor=1.1
