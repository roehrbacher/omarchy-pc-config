# shellcheck shell=bash
# Settings for install.sh / uninstall.sh of omarchy-pc-config.
# Install omarchy-shared-config first: this repo only adds the machine-*.lua
# files and the 50-pc.json bar fragment that the shared files load.
REPO_NAME=omarchy-pc-config

EXTRA_BACKUP=(
  .config/omarchy/shell.json
  .local/share/applications/WhatsApp.desktop
)

# Dropped on the PC: old bindings/rules now split into machine-*.lua are
# replaced by the shared loaders; these extra files are no longer used.
REMOVE_PATHS=(
  .config/omarchy/plugins/timon.power
  .config/omarchy/plugins/timon.bar
  .local/bin/overwatch-use-headphones
  # Mic monitor -> Audio passthrough (now in omarchy-shared-config)
  .config/omarchy/plugins/timon.mic-monitor
  .local/bin/mic-monitor-watch
  .local/bin/omarchy-mic-monitor
  .config/systemd/user/mic-monitor.service
  .config/omarchy/mic-monitor.conf
)

SERVICES=(
  audio-sticky-sink.service
  omarchy-speaker-tuning.service
  app-dev.lizardbyte.app.Sunshine.service
)

post_install() {
  # Files that need an absolute path: fill in @HOME@ for this user.
  local f
  for f in .config/brave-flags.conf .config/voxtype/config.toml; do
    [[ -f $HOME/$f ]] && sed -i "s|@HOME@|$HOME|g" "$HOME/$f"
  done
  # Old mic-monitor service (renamed to audio-passthrough in shared config).
  systemctl --user daemon-reload >/dev/null 2>&1 || true
  systemctl --user disable --now mic-monitor.service >/dev/null 2>&1 || true
  systemctl --user try-restart audio-passthrough.service >/dev/null 2>&1 || true  # pick up the machine conf
  if [[ ! -f $HOME/.config/omarchy/shell.d/00-shared.json ]]; then
    echo "omarchy-shared-config is not installed yet. Install it, then run this again." >&2
  fi
  if command -v systemctl >/dev/null; then
    for unit in "${SERVICES[@]}"; do
      systemctl --user enable --now "$unit" >/dev/null 2>&1 || echo "Could not enable $unit"
    done
  fi
  # WhatsApp: back to Omarchy's own web app (the Chromium workaround is gone).
  local wa="$HOME/.local/share/applications/WhatsApp.desktop"
  if [[ -f $wa ]] && grep -qi chromium "$wa"; then
    local orig
    orig=$(ls -1t "$wa".bak.* 2>/dev/null | head -1 || true)
    if [[ -n $orig ]]; then cp -a "$orig" "$wa"; else rm -f "$wa"; fi
  fi
  if pacman -Q omasnap >/dev/null 2>&1; then
    echo "omasnap is still installed but no longer bound. Remove it with: sudo pacman -R omasnap"
  fi
}

pre_uninstall() {
  command -v systemctl >/dev/null || return 0
  for unit in audio-sticky-sink.service omarchy-speaker-tuning.service; do
    systemctl --user disable --now "$unit" >/dev/null 2>&1 || true
  done
}
